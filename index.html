<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gtsukahara</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1, h2, h3, h4, h5, h6 {
            color: #f0f6fc;
            margin-top: 24px;
            margin-bottom: 16px;
        }
        
        a {
            color: #58a6ff;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        code {
            background-color: #161b22;
            color: #79c0ff;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.9em;
        }
        
        pre {
            background-color: #161b22;
            color: #c9d1d9;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            border-left: 3px solid #30363d;
        }
        
        pre code {
            background-color: transparent;
            color: inherit;
            padding: 0;
        }
        
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="content"></div>
    <script>
        // Load README.md content
        fetch('README.md')
            .then(response => response.text())
            .then(markdown => {
                // Render HTML content directly
                document.getElementById('content').innerHTML = markdown;
            })
            .catch(error => {
                document.getElementById('content').innerHTML = '<p>Unable to load README.md</p>';
                console.error('Error loading README:', error);
            });
    </script>
</body>
</html>
